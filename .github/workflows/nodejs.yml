name: Node CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Check Selenium version resolution
        run: python3 -m unittest discover -s docker/selenium-ci -p 'test_*.py'
      - run: npm install -g web-ext # build tool
      - run: npm run package-chrome
      - run: npm run package-firefox-mv3

  playwright:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install clipboard dependencies
        run: |
          apt-get update && apt-get install -y xsel
      - name: Use Node.js
        # Resolves .node-version (Node 24), matching the Node 24 shipped by the
        # playwright container image above and the Docker e2e harness — keeps the
        # e2e runtime identical across CI and local docker runs.
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Run Vitest UI tests in browser
        run: npm run test:browser
      - name: Run Playwright tests
        # Shared with the Docker harness so the xvfb invocation (screen geometry,
        # RANDR) stays identical across CI and local docker runs. See
        # docker/playwright-ci/run-playwright.sh and DEVELOPMENT.md (E2E tests).
        run: bash docker/playwright-ci/run-playwright.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  selenium:
    name: Selenium ${{ matrix.browser }} (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: build
    # Allow for the uncached image build and the complete Selenium suite.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            profile: "minimum"
          - browser: firefox
            profile: "latest"
          - browser: cft
            profile: "minimum"
          - browser: cft
            profile: "latest"
    steps:
      - uses: actions/checkout@v6
      - name: Run selected Selenium browser suite (Docker)
        # Both profiles contain both browsers; each job selects its test suite.
        env:
          BROWSER: ${{ matrix.browser }}
          PROFILE: ${{ matrix.profile }}
        run: bash docker/selenium-ci/docker-e2e.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: selenium-${{ matrix.profile }}-${{ matrix.browser }}
          path: test-results/selenium-${{ matrix.profile }}-${{ matrix.browser }}/
          retention-days: 30
