name: Node CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm install -g web-ext # build tool
      - run: npm run package-chrome
      - run: npm run package-firefox-mv3

  playwright:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install clipboard dependencies
        run: |
          apt-get update && apt-get install -y xsel
      - name: Use Node.js
        # Resolves .node-version (Node 24), matching the Node 24 shipped by the
        # playwright container image above and the Docker e2e harness — keeps the
        # e2e runtime identical across CI and local docker runs.
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Run Vitest UI tests in browser
        run: npm run test:browser
      - name: Run Playwright tests
        # Shared with the Docker harness so the xvfb invocation (screen geometry,
        # RANDR) stays identical across CI and local docker runs. See
        # docker/playwright-ci/run-playwright.sh and DEVELOPMENT.md (E2E tests).
        run: bash docker/playwright-ci/run-playwright.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  selenium:
    name: Selenium Firefox (${{ matrix.firefox }})
    runs-on: ubuntu-latest
    needs: build
    # Allow for the uncached image build and the complete Selenium suite.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        firefox: ["139.0", "latest"]
    steps:
      - uses: actions/checkout@v6
      - name: Run Selenium Firefox e2e tests (Docker)
        # Resolve latest before Docker build so a new release invalidates its
        # download layer. Both entries share the local Xvfb/D-Bus/AT-SPI harness.
        env:
          FIREFOX_VERSION: ${{ matrix.firefox }}
        run: bash docker/selenium-ci/docker-e2e.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: selenium-firefox-${{ matrix.firefox }}
          path: test-results/selenium-firefox-*/
          retention-days: 30
